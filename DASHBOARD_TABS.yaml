# Voeg deze views later toe onder het bestaande dashboard Lichtbediening.
# Controleer eerst de echte entity-id's; HA kan bij bestaande oude ids een _2 toevoegen.
# Dit bestand gebruikt uitsluitend standaard Home Assistant-kaarten.

- title: Govee
  path: govee
  icon: mdi:led-strip-variant
  type: sections
  sections:
    - type: grid
      cards:
        - type: heading
          heading: Transport en mogelijkheden
          icon: mdi:connection
        - type: entities
          entities:
            - entity: sensor.h6069_transport
              name: H6069 volledige controle
            - entity: sensor.h70b3_transport
              name: H70B3 volledige controle
        - type: markdown
          content: >-
            **H6069:** individuele panelen via LAN.  
            **H70B3:** individuele leds via Bluetooth of actieve proxy.  
            Matter is voor beide alleen basisbediening, niet per element.
    - type: grid
      cards:
        - type: heading
          heading: Snelle tests
          icon: mdi:test-tube
        - type: tile
          entity: button.h6069_demo
        - type: tile
          entity: button.h6069_clear
        - type: tile
          entity: button.h70b3_demo
        - type: tile
          entity: button.h70b3_orientation
        - type: tile
          entity: button.h70b3_clear

