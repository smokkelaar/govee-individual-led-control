- title: H70B3 gordijn
  path: govee-h70b3
  icon: mdi:blinds-open
  type: sections
  max_columns: 3
  sections:
    - type: grid
      cards:
        - type: heading
          heading: Matrix en verbinding
          icon: mdi:led-on
        - type: tile
          entity: light.h70b3_matrix
          features:
            - type: light-brightness
        - type: tile
          entity: sensor.h70b3_transport
        - type: tile
          entity: switch.h70b3_spiegel_horizontal
        - type: tile
          entity: switch.h70b3_spiegel_vertical
    - type: grid
      cards:
        - type: heading
          heading: Test en sensorvisualisatie
          icon: mdi:animation-outline
        - type: tile
          entity: select.h70b3_visual_style
        - type: tile
          entity: number.h70b3_visual_level
          features:
            - type: numeric-input
              style: slider
        - type: tile
          entity: button.h70b3_orientation
        - type: tile
          entity: button.h70b3_demo
        - type: tile
          entity: button.h70b3_clear
    - type: grid
      cards:
        - type: heading
          heading: Logische hoekpixels
          icon: mdi:crop-square
        - type: tile
          entity: light.h70b3_led_r01_k01
          name: Linksboven
        - type: tile
          entity: light.h70b3_led_r01_k20
          name: Rechtsboven
        - type: tile
          entity: light.h70b3_led_r26_k01
          name: Linksonder
        - type: tile
          entity: light.h70b3_led_r26_k20
          name: Rechtsonder
        - type: markdown
          content: >-
            De optionele tab **H70B3 520 leds** toont de hele fysieke matrix.
            Gebruik een tik voor de kleurendialoog en de spiegelknoppen wanneer het doek anders hangt.
